# Local development override. Copy to docker-compose.local.yml and fill in secrets.
# Auth: AUTH_PROVIDER=none uses the noop provider (sign in with any email; no token validation).
# Prodtrack: Set PRODTRACK_PROVIDER=mock to use the read-only mock (no ShotGrid needed).
# To use real ShotGrid, set PRODTRACK_PROVIDER=shotgrid and SHOTGRID_URL, SHOTGRID_SCRIPT_NAME, SHOTGRID_API_KEY.
# Email:
#   EMAIL_PROVIDER=noop logs the message and does not send it (local default).
#   EMAIL_PROVIDER=smtp sends through SMTP. Gmail uses smtp.gmail.com:587 with
#   STARTTLS. SMTP_PASSWORD is a Google App Password (Account → Security →
#   2-Step Verification → App passwords), and SMTP_FROM_EMAIL must match
#   SMTP_USERNAME.
#   EMAIL_PROVIDER=resend needs RESEND_API_KEY and RESEND_FROM_EMAIL.
#   EMAIL_PROVIDER=sendgrid needs SENDGRID_API_KEY and SENDGRID_FROM_EMAIL.
#   ./bootstrap.sh prompts for this. See dna-docs/deployment/email.mdx.
services:
  api:
    environment:
      - PYTHONUNBUFFERED=1
      - SHOTGRID_URL=https://aswf.shotgrid.autodesk.com/
      - SHOTGRID_API_KEY=************
      - SHOTGRID_SCRIPT_NAME=DNA_local_testing
      - PRODTRACK_PROVIDER=mock
      # Sessions: none (default) disables session routes. mock seeds sample sessions.
      - SESSION_PROVIDER=none
      - VEXA_API_KEY=**********
      - VEXA_API_URL=http://vexa:8056
      - OPENAI_API_KEY=your-openai-api-key
      - AUTH_PROVIDER=none
      - EMAIL_PROVIDER=noop
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_START_TLS=true
      - SMTP_USERNAME=YOUR_GMAIL_ADDRESS
      - SMTP_PASSWORD=YOUR_GMAIL_APP_PASSWORD
      - SMTP_FROM_EMAIL=YOUR_GMAIL_ADDRESS
      - RESEND_API_KEY=your-resend-api-key
      - RESEND_FROM_EMAIL=YOUR_FROM_ADDRESS
      - SENDGRID_API_KEY=your-sendgrid-api-key
      - SENDGRID_FROM_EMAIL=YOUR_FROM_ADDRESS
      # Transcript publishing (V1, disabled by default). Set to "true" to
      # expose POST /playlists/{id}/publish-transcript. See DEPLOYMENT.md
      # for the ShotGrid site-setup checklist the custom entity depends on.
      - DNA_ENABLE_TRANSCRIPT_PUBLISH=false
      - SHOTGRID_TRANSCRIPT_ENTITY=CustomEntity01
      # Browser-extension transcription route (opt-in). Choosing option 2 under
      # "Transcription route" in ./bootstrap.sh enables it and appends a randomly
      # generated DNA_EXTENSION_KEY here. That key must match
      # VITE_TRANSCRIPTION_EXTENSION_KEY in the frontend and the key entered once
      # in the extension popup; leave it unset to disable the key gate.
