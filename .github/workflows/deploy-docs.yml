name: Deploy docs to GitHub Pages

permissions:
  contents: read

on:
  push:
    # docs/github-pages is temporary so this branch can be deployed before merge.
    branches: [ main, docs/github-pages ]
    paths:
      - 'dna-docs/**'
      - 'backend/docs/openapi.json'
      # Guides embed live app components (dna-docs/plugins/dna-app-embed.ts).
      - 'frontend/packages/app/src/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/docs/github-pages' }}

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Resolve docs URL
        id: docs-url
        env:
          ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          base="${BASE_PATH}"
          if [[ -z "$base" || "$base" == "/" ]]; then
            base="/"
          else
            base="/${base#/}"
            base="${base%/}/"
          fi
          echo "url=${ORIGIN}" >> "$GITHUB_OUTPUT"
          echo "base_url=${base}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dna-docs/package-lock.json

      - name: Install dependencies
        working-directory: dna-docs
        run: npm ci

      - name: Refresh OpenAPI spec
        working-directory: dna-docs
        run: npm run fetch-openapi

      - name: Type check
        working-directory: dna-docs
        run: npm run gen-api-docs && npm run typecheck

      - name: Build website
        working-directory: dna-docs
        env:
          DOCS_URL: ${{ steps.docs-url.outputs.url }}
          DOCS_BASE_URL: ${{ steps.docs-url.outputs.base_url }}
        run: npm run build:full

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dna-docs/build
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/docs/github-pages'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
